<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Cookie Helper</title>
    <style>
      body { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin: 12px; width: 320px; }
      h3 { margin: 0 0 10px; font-size: 14px; }
      .url { font-size: 12px; color: #555; word-break: break-all; margin-bottom: 10px; }
      button { width: 100%; padding: 10px; margin: 6px 0; border: 0; border-radius: 8px; cursor: pointer; }
      #copy { background: #2563eb; color: #fff; }
      #logout { background: #dc2626; color: #fff; }
      #status { margin-top: 8px; font-size: 12px; color: #111; white-space: pre-wrap; }
      .hint { margin-top: 8px; font-size: 11px; color: #666; }
    </style>
  </head>
  <body>
    <h3>Cookie Helper（本地自用）</h3>
    <div id="url" class="url">当前站点：读取中...</div>
    <button id="copy">一键复制当前站点 Cookies（JSON）</button>
    <button id="logout">一键退出登录（清空当前站点 Cookies）</button>
    <div id="status"></div>
    <div class="hint">提示：仅作用于当前标签页所属站点。</div>
    <script src="popup.js"></script>
  </body>
</html>
